# VeerSetu Khandesh — production nginx site config
# -------------------------------------------------
# Serves the built React SPA from /var/www/veersetu-khandesh and proxies
# API/upload requests to the Spring Boot backend on 127.0.0.1:8080, so the
# browser sees everything as same-origin (same setup the Vite dev proxy
# gives you locally).
#
# Installed automatically by .github/workflows/deploy.yml on every deploy —
# edit this file, not the copy on the server, or your next deploy will
# overwrite manual changes.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/veersetu-khandesh;
    index index.html;

    # React Router does client-side routing, so a path like /map or
    # /soldiers/12 only exists in the browser, not as a file on disk. Without
    # this fallback, nginx 404s on a hard refresh or a direct link to any
    # page other than "/" — that's the "URL shows the bare IP / a random
    # route won't load" bug. Falling back to index.html lets the SPA's own
    # router take over and render the right page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # index.html must always be revalidated so a new deploy is picked up
    # immediately; the Vite build's hashed js/css/asset files never change
    # content under the same name, so they can cache hard.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        access_log off;
    }
}
