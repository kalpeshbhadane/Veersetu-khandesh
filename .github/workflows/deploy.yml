name: Deploy VeerSetu Khandesh

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build backend jar
        run: mvn -B clean package -DskipTests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Copy backend jar to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/khandesh-1.0.0.jar"
          target: "/home/ubuntu/veersetu-khandesh/target/"
          strip_components: 1

      - name: Copy frontend build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend/dist/*"
          target: "/home/ubuntu/veersetu-khandesh-incoming-dist/"
          strip_components: 2

      - name: Restart backend and republish frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl restart veersetu
            sudo rm -rf /var/www/veersetu-khandesh/*
            sudo cp -r /home/ubuntu/veersetu-khandesh-incoming-dist/* /var/www/veersetu-khandesh/
            sudo chown -R www-data:www-data /var/www/veersetu-khandesh
            sudo systemctl reload nginx
            echo "Deploy complete"
