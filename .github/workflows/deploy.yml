name: Deploy VeerSetu Khandesh

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build backend jar
        run: mvn -B clean package -DskipTests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Decode SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Ensure remote folders exist
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} "mkdir -p /home/${{ secrets.EC2_USERNAME }}/veersetu-khandesh/target /home/${{ secrets.EC2_USERNAME }}/veersetu-khandesh-incoming-dist"

      - name: Copy backend jar to server
        run: |
          scp -i ~/.ssh/deploy_key target/khandesh-1.0.0.jar ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USERNAME }}/veersetu-khandesh/target/khandesh-1.0.0.jar

      - name: Copy frontend build to server
        run: |
          scp -i ~/.ssh/deploy_key -r frontend/dist/* ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USERNAME }}/veersetu-khandesh-incoming-dist/

      - name: Restart backend and republish frontend
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} '
            sudo systemctl restart veersetu &&
            sudo rm -rf /var/www/veersetu-khandesh/* &&
            sudo cp -r /home/${{ secrets.EC2_USERNAME }}/veersetu-khandesh-incoming-dist/* /var/www/veersetu-khandesh/ &&
            sudo chown -R www-data:www-data /var/www/veersetu-khandesh &&
            sudo systemctl reload nginx &&
            echo "Deploy complete"
          '
