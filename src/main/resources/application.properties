spring.application.name=VeerSetu Khandesh

# ---- MySQL ----
spring.datasource.url=jdbc:mysql://localhost:3306/veersetu_khandesh?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# Use 'update' during development. Switch to 'validate' once schema.sql has been run in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---- File uploads ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
veersetu.upload-dir=uploads

# ---- Server ----
server.port=8080
