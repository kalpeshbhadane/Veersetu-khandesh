spring.application.name=VeerSetu Khandesh

# ---- MySQL ----
spring.datasource.url=jdbc:mysql://localhost:3306/veersetu_khandesh?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# Use 'update' during development. Switch to 'validate' once schema.sql has been run in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---- File uploads ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
veersetu.upload-dir=uploads

# ---- Email (optional; used for "forgot password" links) ----
# spring.mail.host is intentionally not set here. Spring Boot only wires up
# a real mail sender when it's present, so by default reset links are just
# printed to the console (see EmailService) — handy for local development.
# To send real email in production, set these as environment variables
# (Spring Boot maps SPRING_MAIL_HOST etc. automatically, no properties
# change needed): SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME,
# SPRING_MAIL_PASSWORD — e.g. for Gmail: smtp.gmail.com / 587 / your address
# / an app password.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Public URL of the deployed frontend, used to build the link inside
# password-reset emails.
veersetu.frontend-url=${FRONTEND_URL:http://localhost:5173}
veersetu.reset-token-expiry-minutes=30

# ---- Server ----
server.port=8080
